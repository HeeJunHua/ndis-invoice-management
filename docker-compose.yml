version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ndis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ndis
      POSTGRES_PASSWORD: ndis_password
      POSTGRES_DB: ndis_invoicing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndis -d ndis_invoicing"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ndis_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot helper: creates the invoice bucket automatically on `docker compose up`
  minio-init:
    image: minio/mc:latest
    container_name: ndis_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/ndis-invoices || true;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
